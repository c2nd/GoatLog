      <style>
.btn-cyber {
  --accent: #00ff9c;
  --bg:     #0d1511;
  --border: #1b3528;

  position: relative;
  display: flex;
  margin: 34px auto;
  width: fit-content;
  align-items: center;
  gap: 16px;
  padding: 16px 36px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--accent);
  font-family: monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  animation: btnBreathe 3.2s ease-in-out infinite;
  transition:
    border-color 0.35s ease,
    box-shadow   0.35s ease,
    letter-spacing 0.45s ease,
    background   0.35s ease,
    transform    0.15s ease;
}

/* ===== نبض خافت في الوضع الخامل ===== */
@keyframes btnBreathe {
  0%, 100% {
    box-shadow: inset 0 0 0 0 rgba(0,255,156,0);
    border-color: var(--border);
  }
  50% {
    box-shadow: inset 0 0 12px rgba(0,255,156,0.08),
                0 0 10px rgba(0,255,156,0.08);
    border-color: rgba(0,255,156,0.35);
  }
}

/* ===== نقطة الحالة النابضة ===== */
.btn-cyber__dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
  flex-shrink: 0;
  animation: btnPulse 1.8s ease-in-out infinite;
  position: relative;
  z-index: 2;
}

@keyframes btnPulse {
  0%, 100% { opacity: 1;   transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.75); }
}

/* ===== النص ===== */
.btn-cyber__text {
  position: relative;
  z-index: 2;
  transition: text-shadow 0.35s ease;
}

/* ===== السهم ===== */
.btn-cyber__arrow {
  position: relative;
  z-index: 2;
  transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
}

/* ===== Scanline (شريط المسح) ===== */
.btn-cyber::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(0, 255, 156, 0.22) 50%,
    transparent 100%
  );
  transition: left 0.75s cubic-bezier(0.25, 0.8, 0.25, 1);
  pointer-events: none;
  z-index: 1;
}

/* ===== HOVER ===== */
.btn-cyber:hover {
  animation: none;
  border-color: var(--accent);
  letter-spacing: 4px;
  background: linear-gradient(135deg, #0d1511 0%, #0a1f16 100%);
  box-shadow:
    inset 0 0 0 1px var(--accent),
    inset 0 0 24px rgba(0, 255, 156, 0.08),
    0 0 22px rgba(0, 255, 156, 0.28),
    0 10px 30px rgba(0, 0, 0, 0.55);
}

.btn-cyber:hover::before {
  left: 120%;
}

.btn-cyber:hover .btn-cyber__text {
  text-shadow: 0 0 14px rgba(0, 255, 156, 0.7);
}

.btn-cyber:hover .btn-cyber__arrow {
  transform: translateX(6px);
}

/* ===== ACTIVE (ضغط) ===== */
.btn-cyber:active {
  transform: translateY(1px) scale(0.985);
  box-shadow:
    inset 0 0 0 1px var(--accent),
    inset 0 0 30px rgba(0, 255, 156, 0.15),
    0 0 40px rgba(0, 255, 156, 0.45);
  transition:
    transform 0.06s ease,
    box-shadow 0.06s ease;
}

/* ===== FOCUS للكيبورد ===== */
.btn-cyber:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

/* ===== احترام تفضيلات الحركة ===== */
@media (prefers-reduced-motion: reduce) {
  .btn-cyber,
  .btn-cyber__dot {
    animation: none;
  }
  .btn-cyber,
  .btn-cyber::before,
  .btn-cyber__text,
  .btn-cyber__arrow {
    transition: none;
  }
}


  
@media (min-width: 768px) {
  .button-82-front {
    font-size: 1.25rem;
    padding: 12px 42px;
  }
}

.button-82-pushable:hover {
  filter: brightness(110%);
  -webkit-filter: brightness(110%);
}

.button-82-pushable:hover .button-82-front {
  transform: translateY(-6px);
  transition:
    transform
    250ms
    cubic-bezier(.3, .7, .4, 1.5);
}

.button-82-pushable:active .button-82-front {
  transform: translateY(-2px);
  transition: transform 34ms;
}

.button-82-pushable:hover .button-82-shadow {
  transform: translateY(4px);
  transition:
    transform
    250ms
    cubic-bezier(.3, .7, .4, 1.5);
}

.button-82-pushable:active .button-82-shadow {
  transform: translateY(1px);
  transition: transform 34ms;
}

.button-82-pushable:focus:not(:focus-visible) {
  outline: none;
}
